spring:
  application:
    name: rideops
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rideops}
    username: ${DB_USER:rideops}
    password: ${DB_PASSWORD:rideops}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}

security:
  jwt:
    # SECURITY: JWT_SECRET DEVE essere una stringa Base64 di 32 byte casuali (256 bit).
    # Generare con: openssl rand -base64 32
    # Nessun fallback: l'applicazione fallisce al boot se la variabile non e' impostata.
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

rideops:
  public-url: ${RIDEOPS_PUBLIC_URL:https://rideops.it}
  login-url: ${RIDEOPS_LOGIN_URL:https://rideops.it/login}
  security:
    admin:
      user-id: ${ADMIN_USER_ID:admin}
      email: ${ADMIN_EMAIL:admin@rideops.local}
      # SECURITY: nessun default. L'app fallisce al boot se ADMIN_PASSWORD non e' impostata.
      password: ${ADMIN_PASSWORD}

brevo:
  api-key: ${BREVO_API_KEY:}
  sender-email: ${BREVO_SENDER_EMAIL:noreply@rideops.it}
  sender-name: ${BREVO_SENDER_NAME:RideOps}
  base-url: ${BREVO_BASE_URL:https://api.brevo.com/v3}
  reply-to: ${BREVO_REPLY_TO:support@rideops.it}
