# ── HTTP: redirect tutto a HTTPS + challenge ACME ────────────────────────────
server {
    listen 80;
    server_name rideops.it www.rideops.it;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: frontend + backend API ────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name rideops.it www.rideops.it;

    # Certificati Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/rideops.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rideops.it/privkey.pem;

    # Parametri TLS sicuri
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    # Header di sicurezza
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Timeout generali
    proxy_read_timeout  60s;
    proxy_send_timeout  60s;
    proxy_connect_timeout 10s;

    # ── Actuator BLOCCATO dall'esterno ───────────────────────────────────────
    location /actuator {
        deny all;
        return 403;
    }

    # ── Frontend Next.js ─────────────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
