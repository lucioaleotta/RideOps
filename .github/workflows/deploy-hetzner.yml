name: Deploy to Hetzner

on:
  push:
    branches: [main]
    # Ignora push che toccano solo file non-runtime.
    # Best practice: paths-ignore è preferibile a paths quando la maggioranza
    # dei file DEVE triggerare il deploy e si vogliono escludere poche eccezioni.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/workflows/docs-ci.yml"
      - ".github/workflows/backend-ci.yml"
      - "CONTRIBUTING.md"
      - "BRANCHING_STRATEGY.md"
      - "QUICKSTART.md"
      - "TESTING_STRATEGY.md"
      - "TROUBLESHOOTING.md"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: git SHA short)"
        required: false
        default: ""

# Concurrency guard: se arriva un nuovo push su main mentre il deploy precedente
# è ancora in corso, lo annulla immediatamente.
# Questo evita deploy "sovrapposti" e spreco di minuti CI.
# Il gruppo è per branch, quindi workflow_dispatch manuali non si cancellano a vicenda.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 0. Detect quali parti del codice sono cambiate
  # ─────────────────────────────────────────────────────────────────────────────
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend:  ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra:    ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v6
      # dorny/paths-filter legge i file modificati nel commit/push e espone
      # output booleani per ogni filtro. Consente di saltare job costosi
      # (build Docker) se la parte corrispondente non è cambiata.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            infra:
              - 'nginx/**'
              - 'docker-compose.prod.yml'
              - 'scripts/server/**'

  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Test backend
  # ─────────────────────────────────────────────────────────────────────────────
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: changes
    # Salta i test se il backend non è cambiato (ma gira sempre su workflow_dispatch)
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Run tests
        working-directory: backend
        run: mvn -q test -B

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Build & push immagini su GHCR
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [changes, test-backend]
    # Gira se almeno una delle due parti (o l'infra) è cambiata, oppure su dispatch.
    # test-backend è in needs ma potrebbe essere stato skippato: usiamo result != 'failure'.
    if: |
      always() &&
      needs.test-backend.result != 'failure' &&
      (
        needs.changes.outputs.backend  == 'true' ||
        needs.changes.outputs.frontend == 'true' ||
        needs.changes.outputs.infra    == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Determina tag immagine
        id: tag
        run: |
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/rideops-backend:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/rideops-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/rideops-frontend:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/rideops-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Deploy sul server Hetzner via SSH
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Hetzner VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Sincronizza script e config sul server
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.HETZNER_HOST }}
          username: root
          key:      ${{ secrets.HETZNER_SSH_KEY }}
          port:     22
          source:   "scripts/server/**,scripts/copy_ssl_and_reload_nginx.sh,nginx/**,docker-compose.prod.yml"
          target:   "/opt/rideops"
          strip_components: 0

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.HETZNER_HOST }}
          username: root
          key:      ${{ secrets.HETZNER_SSH_KEY }}
          port:     22
          envs:     GHCR_TOKEN,GHCR_USER,IMAGE_TAG,BREVO_API_KEY,BREVO_SENDER_EMAIL,BREVO_SENDER_NAME,BREVO_BASE_URL,BREVO_REPLY_TO
          script: |
            cd /opt/rideops
            export IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
            bash /opt/rideops/scripts/server/pull-and-restart.sh "$IMAGE_TAG"
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER:  ${{ github.actor }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME }}
          BREVO_BASE_URL: ${{ secrets.BREVO_BASE_URL }}
          BREVO_REPLY_TO: ${{ secrets.BREVO_REPLY_TO }}

      - name: Health check
        run: |
          echo "Attendo avvio servizi..."
          sleep 30
          for i in {1..6}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.HETZNER_HOST }}/ 2>/dev/null || echo "000")
            echo "Tentativo $i: HTTP $STATUS"
            if [[ "$STATUS" == "200" || "$STATUS" == "301" || "$STATUS" == "302" || "$STATUS" == "308" ]]; then
              echo "Health check OK"
              exit 0
            fi
            sleep 10
          done
          echo "Health check FALLITO dopo 6 tentativi"
          exit 1
