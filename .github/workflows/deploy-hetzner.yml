name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: git SHA short)"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Test backend
  # ─────────────────────────────────────────────────────────────────────────────
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Run tests
        working-directory: backend
        run: mvn -q test -B

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Build & push immagini su GHCR
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test-backend
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Determina tag immagine
        id: tag
        run: |
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/rideops-backend:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/rideops-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/rideops-frontend:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/rideops-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Deploy sul server Hetzner via SSH
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Hetzner VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.HETZNER_HOST }}
          username: root
          key:      ${{ secrets.HETZNER_SSH_KEY }}
          port:     22
          script: |
            cd /opt/rideops
            export IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
            bash /opt/rideops/scripts/server/pull-and-restart.sh "$IMAGE_TAG"

      - name: Health check
        run: |
          echo "Attendo avvio servizi..."
          sleep 30
          for i in {1..6}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.HETZNER_HOST }}/ 2>/dev/null || echo "000")
            echo "Tentativo $i: HTTP $STATUS"
            if [[ "$STATUS" == "200" || "$STATUS" == "308" || "$STATUS" == "302" ]]; then
              echo "Health check OK"
              exit 0
            fi
            sleep 10
          done
          echo "Health check FALLITO dopo 6 tentativi"
          exit 1
