name: Docs CI

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/docs-ci.yml"
      - ".markdownlint.json"
      - ".markdown-link-check.json"
      - "CONTRIBUTING.md"
      - "README.md"
  pull_request:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/docs-ci.yml"
      - ".markdownlint.json"
      - ".markdown-link-check.json"
      - "CONTRIBUTING.md"
      - "README.md"

# Nessun motivo di tenere in coda più run di lint/validazione Markdown.
concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-markdown:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js (for markdown tools)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install markdown linter
        run: npm install -g markdownlint-cli

      - name: Lint Markdown files
        run: |
          echo "📝 Checking Markdown files..."
          markdownlint docs/**/*.md *.md --config .markdownlint.json

  check-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js (for link checker)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install markdown link checker
        run: npm install -g markdown-link-check

      - name: Check markdown links
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "🔗 Checking links in $file"
            markdown-link-check "$file" -c .markdown-link-check.json
          done < <(find docs -name '*.md' -print && find . -maxdepth 1 -name '*.md' -print)

  build-summary:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Count documentation files
        run: |
          echo "📊 Documentation Summary"
          echo "- Docs files: $(find docs -name '*.md' | wc -l)"
          echo "- Root docs: $(ls -1 *.md 2>/dev/null | wc -l)"

      - name: List recent docs
        run: |
          echo "📄 Documentation files:"
          ls -1 docs/*.md | head -5

      - name: Comment PR with summary
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const docsCount = require('child_process')
              .execSync('find docs -name "*.md" | wc -l')
              .toString()
              .trim();
            
            const comment = `✅ Documentation validated\n\n**Stats:**\n- 📄 Markdown files: ${docsCount}`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
