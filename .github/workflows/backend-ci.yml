name: Backend CI

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

# Annulla run precedenti sullo stesso branch/PR se arriva un nuovo commit.
# Su PR questo evita di sprecare minuti su commit intermedi di un force-push.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archunit:
    name: Architecture Rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run architecture tests
        working-directory: backend
        run: >-
          mvn -B
          -Dtest=SecurityArchitectureRules,RepositoryTenantScopingArchitectureTest
          test

      - name: Publish architecture test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Architecture Rules Report
          path: backend/target/surefire-reports/TEST-*.xml
          reporter: java-junit
          use-actions-summary: "true"
          list-suites: failed
          list-tests: failed
          fail-on-error: "true"

  build-and-test:
    name: Build and Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test backend
        working-directory: backend
        run: mvn -B verify
